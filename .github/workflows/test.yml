name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test test/gate.test.mjs test/guard.test.mjs
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Good page passes
        uses: ./
        with:
          paths: "test/site/index.html"
          base-url: "https://acme.example"
          min-score: "80"
      - name: Bare page fails as expected
        id: bare
        continue-on-error: true
        uses: ./
        with:
          paths: "test/site/about/*.html"
          min-score: "80"
      - name: Check the bare page failed
        run: test "${{ steps.bare.outcome }}" = "failure"
